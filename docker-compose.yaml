name: merging

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW_HOME: /opt/airflow/data/airflow_home
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./dags:/opt/airflow/dags
    - ./utils:/opt/airflow/utils
    - ./data:/opt/airflow/weatherdata
    - airflow-data:/opt/airflow/data

services:
  init-permissions:
    <<: *airflow-common
    user: "0:0"
    entrypoint: ["bash", "-c"]
    command: ["mkdir -p /opt/airflow/data/airflow_home && chown -R airflow:root /opt/airflow/data"]
  airflow-init-user:
    <<: *airflow-common
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    entrypoint: ["bash", "-c"]
    command:
      - >-
        airflow db migrate &&
        (airflow users list | grep -qw admin &&
        airflow users reset-password --username admin --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" ||
        airflow users create --username admin --firstname Airflow --lastname Admin --role Admin --email admin@example.com --password "${AIRFLOW_ADMIN_PASSWORD:-admin}")

  mlflow:
    <<: *airflow-common
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////opt/airflow/data/mlflow.db
      --default-artifact-root /opt/airflow/data/mlartifacts
    ports:
      - "5000:5000"
    restart: unless-stopped

  airflow:
    <<: *airflow-common
    depends_on:
      airflow-init-user:
        condition: service_completed_successfully
    command: standalone
    ports:
      - "8081:8080"
    restart: unless-stopped
  api:
    build:
      context: ./app/api
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data/GeoPodaci:/data/GeoPodaci:ro

      - airflow-data:/opt/airflow/data
    ports:
      - "8000:8000"
    restart: unless-stopped
  ui:
    build:
      context: ./app/ui
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  airflow-data:
